[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "inotify-simple"
version = "2.0.1"
description = "A simple wrapper around inotify. No fancy bells and whistles, just a literal wrapper with ctypes. Under 100 lines of code!"
authors = [{ name = "Chris Billington", email = "chrisjbillington@gmail.com" }]
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
keywords = ["inotify"]
requires-python = ">=3.14"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/chrisjbillington/inotify_simple.git"
Documentation = "http://inotify-simple.readthedocs.io/"
Issues = "https://github.com/chrisjbillington/inotify_simple/issues"

[tool.poetry]
packages = [{ include = "inotify_simple", from = "src" }]
include = [{ path = "src/inotify_simple/py.typed", format = ["sdist", "wheel"] }]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.13",
    "radon>=6",
    "pyright>=1.1.400",
    "xenon>=0.9",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["README.md"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "C90", "SIM", "RET", "PL",
    "PT", "PTH", "RUF", "TRY", "S", "ANN", "D", "PERF", "FURB", "TC",
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "TRY003",  # long messages in exception constructors are fine here
    "ANN",  # enabled again together with strict typing
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004", "ANN401"]
"src/inotify_simple/__init__.py" = ["N801"]  # flags/masks/INotify are public API
"example.py" = ["S", "D", "T20", "INP001"]
"docs/**" = ["D", "INP001", "A001", "PTH"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
